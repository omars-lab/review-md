# Pre-commit hooks for review-md.
# Uses `repo: local` so hooks run the tools already installed on the machine
# (gitleaks, dotenvx) — no network fetch, and identical to the `make` targets
# CI runs (local == CI parity, per CLAUDE.md).
#
# Install:  make hooks   (installs both the pre-commit and post-commit hook types)
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks — block secrets in staged changes
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false

      - id: dotenvx-precommit
        name: dotenvx — block committing plaintext .env / .env.keys
        entry: dotenvx ext precommit
        language: system
        pass_filenames: false

      - id: xcallback-api
        name: x-callback API docs in sync with schema
        entry: node scripts/gen-xcallback-api.mjs --check
        language: system
        pass_filenames: false
        files: '^(src/protocol/xcallback\.schema\.json|scripts/gen-xcallback-api\.mjs|docs/api/)'

      # post-commit stage: after a commit lands, re-anchor any working-copy comment
      # threads whose reviewed file was just committed (WORKING_REV → real commit).
      # The reviewed file is committed in the CLI, not Obsidian, so this runs here
      # rather than in the plugin. See docs/issues/reanchor-hook.md.
      - id: reanchor-working-comments
        name: re-anchor working-copy comment threads to their commit
        entry: node scripts/reanchor-comments.mjs
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
        verbose: true
